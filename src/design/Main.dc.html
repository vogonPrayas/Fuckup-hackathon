<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --paper:oklch(98% 0.012 85);
      --paper-2:oklch(95% 0.016 85);
      --ink:oklch(24% 0.02 85);
      --ink-soft:oklch(48% 0.02 85);
      --line:oklch(87% 0.016 85);
      --green:oklch(46% 0.09 152);
      --green-soft:oklch(91% 0.035 152);
      --rust:oklch(56% 0.15 45);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--green); }
    a:hover { color: oklch(38% 0.09 152); }
  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--paper);display:flex;flex-direction:column;font-family:'Public Sans',system-ui,sans-serif;color:var(--ink);position:relative;overflow:hidden;">

  <div style="display:flex;flex-direction:column;gap:2px;padding:22px 22px 14px;">
    <div style="font-family:'Spectral',Georgia,serif;font-style:italic;font-weight:600;font-size:22px;letter-spacing:0.2px;">Wildline</div>
    <div style="font-size:13px;color:var(--ink-soft);">Plan a wild camping trip</div>
  </div>

  <div style="margin:0 16px;border-radius:20px;overflow:hidden;position:relative;height:392px;background:linear-gradient(180deg, oklch(93% 0.02 140) 0%, oklch(96% 0.014 85) 60%);border:1px solid var(--line);">
    <svg width="358" height="392" viewBox="0 0 358 392" style="position:absolute;inset:0;">
      <path d="M-10 260 C 40 220, 90 250, 130 210 S 220 170, 260 200 S 340 240, 380 210" fill="none" stroke="var(--line)" stroke-width="1.6"/>
      <path d="M-10 300 C 50 265, 100 290, 150 250 S 240 210, 290 245 S 360 280, 400 250" fill="none" stroke="var(--line)" stroke-width="1.6"/>
      <path d="M-10 340 C 60 310, 120 330, 170 295 S 260 260, 310 290 S 380 320, 410 295" fill="none" stroke="var(--line)" stroke-width="1.6"/>
      <path d="M40 40 C 80 20, 120 45, 150 30 S 210 15, 250 35" fill="none" stroke="var(--line)" stroke-width="1.4"/>
      <path d="M20 80 C 70 55, 130 85, 175 60 S 250 45, 300 70" fill="none" stroke="var(--line)" stroke-width="1.4"/>
      <path d="M0 120 C 60 95, 140 125, 190 95 S 270 80, 330 105" fill="none" stroke="var(--line)" stroke-width="1.4"/>
      <path d="M120 30 C 160 60, 150 110, 190 140 C 230 170, 210 220, 250 250" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 10"/>
      <circle cx="120" cy="30" r="7" fill="var(--green)"/>
      <circle cx="120" cy="30" r="12" fill="none" stroke="var(--green)" stroke-width="1.5" opacity="0.4"/>
      <circle cx="250" cy="250" r="9" fill="none" stroke="var(--rust)" stroke-width="2.5"/>
      <circle cx="250" cy="250" r="3" fill="var(--rust)"/>
    </svg>

    <div style="position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:10px;background:white;border-radius:14px;padding:12px 14px;box-shadow:0 4px 14px oklch(30% 0.03 85 / 0.14);">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="var(--ink-soft)" stroke-width="1.7"/><path d="M17 17L13.4 13.4" stroke="var(--ink-soft)" stroke-width="1.7" stroke-linecap="round"/></svg>
      <div style="font-size:14.5px;color:var(--ink);">Coledale Fells, Lake District</div>
    </div>

    <div style="position:absolute;left:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;align-items:center;gap:7px;background:white;border-radius:10px;padding:6px 10px;box-shadow:0 2px 8px oklch(30% 0.03 85 / 0.12);">
        <span style="width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block;"></span>
        <span style="font-size:12.5px;">Start · Braithwaite</span>
      </div>
      <div style="display:flex;align-items:center;gap:7px;background:white;border-radius:10px;padding:6px 10px;box-shadow:0 2px 8px oklch(30% 0.03 85 / 0.12);">
        <span style="width:9px;height:9px;border-radius:50%;border:2px solid var(--rust);display:inline-block;"></span>
        <span style="font-size:12.5px;">End · Force Crag</span>
      </div>
    </div>

    <div style="position:absolute;right:14px;bottom:14px;background:white;border-radius:12px;padding:9px 12px;box-shadow:0 2px 8px oklch(30% 0.03 85 / 0.12);font-size:12px;color:var(--ink-soft);">Tap map to set pins</div>
  </div>

  <div style="margin:16px 16px 0;background:var(--paper-2);border-radius:18px;border:1px solid var(--line);padding:18px 18px 20px;display:flex;flex-direction:column;gap:18px;">

    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;">Duration</div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <button style="width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:white;font-size:18px;color:var(--ink);display:flex;align-items:center;justify-content:center;">–</button>
        <div style="font-family:'Spectral',Georgia,serif;font-size:26px;font-weight:600;">4 days</div>
        <button style="width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:white;font-size:18px;color:var(--ink);display:flex;align-items:center;justify-content:center;">+</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <div style="font-size:12.5px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.06em;">Daily walking capacity</div>
      <div style="display:flex;gap:8px;">
        <div style="flex:1;text-align:center;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:white;font-size:13px;color:var(--ink-soft);">Easy<br><span style="font-size:11.5px;">8–12km</span></div>
        <div style="flex:1;text-align:center;padding:10px 4px;border-radius:12px;border:1.5px solid var(--green);background:var(--green-soft);font-size:13px;color:var(--green);font-weight:600;">Moderate<br><span style="font-size:11.5px;font-weight:500;">12–18km</span></div>
        <div style="flex:1;text-align:center;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:white;font-size:13px;color:var(--ink-soft);">Ambitious<br><span style="font-size:11.5px;">18–25km</span></div>
      </div>
    </div>
  </div>

  <div style="margin-top:auto;padding:18px 16px 24px;">
    <button style="width:100%;background:var(--green);color:white;border:none;border-radius:16px;padding:16px;font-size:16px;font-weight:600;font-family:'Public Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;">
      Plan my route
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
