<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=Public+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root{
      --paper:oklch(98% 0.012 85);
      --paper-2:oklch(95% 0.016 85);
      --ink:oklch(24% 0.02 85);
      --ink-soft:oklch(48% 0.02 85);
      --line:oklch(87% 0.016 85);
      --green:oklch(46% 0.09 152);
      --green-soft:oklch(91% 0.035 152);
      --rust:oklch(56% 0.15 45);
      --rust-soft:oklch(93% 0.045 55);
      --amber:oklch(70% 0.15 75);
      --amber-soft:oklch(93% 0.05 80);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--rust); }
    a:hover { color: oklch(46% 0.15 45); }
  </style>
</helmet>
<div style="width:390px;height:844px;background:var(--paper);display:flex;flex-direction:column;font-family:'Public Sans',system-ui,sans-serif;color:var(--ink);position:relative;overflow:hidden;">

  <div style="display:flex;align-items:center;gap:12px;padding:20px 20px 10px;">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4L6 10L12 16" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="flex:1;">
      <div style="font-family:'Spectral',Georgia,serif;font-weight:600;font-size:18px;">Coledale Fells route</div>
      <div style="font-size:12.5px;color:var(--ink-soft);">Risk simulation · on</div>
    </div>
    <div style="width:38px;height:22px;border-radius:11px;background:var(--rust);position:relative;">
      <div style="position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:white;"></div>
    </div>
  </div>

  <div style="margin:4px 16px 0;background:var(--amber-soft);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;">
    <svg width="18" height="18" viewBox="0 0 20 20" fill="none" style="flex-shrink:0;"><path d="M10 2L18.5 17H1.5Z" stroke="var(--rust)" stroke-width="1.5" stroke-linejoin="round"/><path d="M10 8V12" stroke="var(--rust)" stroke-width="1.6" stroke-linecap="round"/><circle cx="10" cy="14.6" r="0.9" fill="var(--rust)"/></svg>
    <div style="font-size:12.5px;line-height:1.4;"><span style="font-weight:700;color:var(--rust);">Moderate risk</span> — 3 of 4 days flagged. Nothing that stops the trip, worth a look.</div>
  </div>

  <div style="margin:12px 16px 0;border-radius:18px;overflow:hidden;position:relative;height:200px;background:linear-gradient(180deg, oklch(93% 0.02 140) 0%, oklch(96% 0.014 85) 65%);border:1px solid var(--line);">
    <svg width="358" height="200" viewBox="0 0 358 200" style="position:absolute;inset:0;">
      <path d="M-10 130 C 40 105, 90 120, 130 95 S 220 78, 260 100 S 340 120, 380 100" fill="none" stroke="var(--line)" stroke-width="1.5"/>
      <path d="M10 30 C 60 12, 120 35, 165 18 S 240 10, 290 28" fill="none" stroke="var(--line)" stroke-width="1.4"/>

      <path d="M40 165 C 65 140, 58 115, 95 98" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round"/>
      <path d="M95 98 C 130 82, 145 55, 180 40" fill="none" stroke="var(--rust)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M180 40 C 210 50, 215 80, 245 92" fill="none" stroke="var(--amber)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M245 92 C 275 104, 285 128, 315 140" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9"/>

      <circle cx="40" cy="165" r="6" fill="var(--green)"/>
      <circle cx="315" cy="140" r="6" fill="none" stroke="var(--ink-soft)" stroke-width="2"/>

      <g transform="translate(130,58)">
        <path d="M0 12 L7 -8 L14 12Z" fill="var(--rust-soft)" stroke="var(--rust)" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M7 -8 L7 -14 M4 -12 L10 -10" stroke="var(--rust)" stroke-width="1.3" stroke-linecap="round"/>
      </g>
    </svg>
    <div style="position:absolute;right:12px;top:12px;background:white;border-radius:10px;padding:5px 9px;box-shadow:0 2px 8px oklch(30% 0.03 85 / 0.12);font-size:11px;color:var(--rust);font-weight:600;">Exposed ridge · flagged</div>
  </div>

  <div style="display:flex;gap:8px;padding:14px 16px 4px;">
    <div style="flex:1;text-align:center;padding:8px 0 7px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);position:relative;">Day 1<span style="position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--green);"></span></div>
    <div style="flex:1;text-align:center;padding:8px 0 7px;border-radius:12px;background:var(--rust);color:white;font-size:12.5px;font-weight:600;position:relative;">Day 2<span style="position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:white;"></span></div>
    <div style="flex:1;text-align:center;padding:8px 0 7px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);position:relative;">Day 3<span style="position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--amber);"></span></div>
    <div style="flex:1;text-align:center;padding:8px 0 7px;border-radius:12px;background:var(--paper-2);border:1px solid var(--line);font-size:12.5px;color:var(--ink-soft);position:relative;">Day 4<span style="position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--amber);"></span></div>
  </div>

  <div style="margin:12px 16px 0;background:var(--paper-2);border-radius:18px;border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:12px;flex:1;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div style="font-family:'Spectral',Georgia,serif;font-weight:600;font-size:15px;">Day 2 risk factors</div>
      <div style="font-size:11.5px;color:var(--rust);font-weight:700;background:var(--rust-soft);padding:3px 9px;border-radius:8px;">High</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:9px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" style="flex-shrink:0;"><path d="M5 12.5C3 12.5 1.5 11 1.5 9C1.5 7.2 2.8 5.7 4.5 5.4C5 3.4 6.8 2 9 2C11.5 2 13.6 3.9 13.9 6.3C15.9 6.6 17.5 8.3 17.5 10.3C17.5 12.6 15.6 14.5 13.3 14.5H5.5" stroke="var(--rust)" stroke-width="1.4"/><path d="M7 16.5L9 14.5M11 17.5L13 15.5" stroke="var(--rust)" stroke-width="1.4" stroke-linecap="round"/></svg>
        <div style="flex:1;font-size:12.5px;">Afternoon storm on the ridge</div>
        <div style="font-size:12.5px;font-weight:700;color:var(--rust);">62%</div>
      </div>
      <div style="height:5px;background:var(--rust-soft);border-radius:3px;"><div style="width:62%;height:100%;background:var(--rust);border-radius:3px;"></div></div>

      <div style="display:flex;align-items:center;gap:10px;margin-top:4px;">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" style="flex-shrink:0;"><path d="M4 17C4 13 7 11 10 11C13 11 16 13 16 17" stroke="var(--amber)" stroke-width="1.5"/><circle cx="10" cy="7" r="3.4" stroke="var(--amber)" stroke-width="1.5"/></svg>
        <div style="flex:1;font-size:12.5px;">Fatigue past 12km, capacity is tight</div>
        <div style="font-size:12.5px;font-weight:700;color:var(--amber);">38%</div>
      </div>
      <div style="height:5px;background:var(--amber-soft);border-radius:3px;"><div style="width:38%;height:100%;background:var(--amber);border-radius:3px;"></div></div>
    </div>

    <div style="margin-top:auto;">
      <button style="width:100%;background:var(--ink);color:white;border:none;border-radius:14px;padding:14px;font-size:14.5px;font-weight:600;font-family:'Public Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;">
        See full risk breakdown
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M4 10H16M16 10L11 5M16 10L11 15" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
